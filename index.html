<style>
  :root {
    --bg: #1c1714;        /* brand dark background */
    --ink: #f3e6cf;       /* warm cream */
    --amber: #ffb347;     /* the filament */
    --muted: #b8a68c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 100, "WONK" 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    width: min(300px, 62vw);
    height: auto;
    /* the lockup leaves room around the mark for its glow; pull the text up into it */
    margin: -4% 0 -4%;
  }
  .logo svg { display: block; width: 100%; height: auto; }
  h1 {
    font-weight: 600;
    font-size: clamp(1.25rem, 4.2vw, 1.75rem);
    line-height: 1.25;
    font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 48;
  }
  /* the tagline is always two lines, one statement each */
  h1 span { display: block; }
  .fields {
    margin-top: 0.9rem;
    font-size: 0.8rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fields span { color: var(--amber); padding: 0 0.35em; }
  .soon {
    margin-top: 2.2rem;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--amber);
  }

  /* the tube: a slow breathing glow with an uneven stutter now and then. One animation per element
     (two animations on the same property would override each other). The filament core dips hardest. */
  @keyframes glow {
    0%, 100% { opacity: 1; }
    10% { opacity: .9; }   20% { opacity: 1; }
    30% { opacity: 1; }    31% { opacity: .4; }
    32.5% { opacity: .9; } 34% { opacity: .5; }   36% { opacity: 1; }
    55% { opacity: .88; }  68% { opacity: 1; }
    82% { opacity: 1; }    83% { opacity: .3; }   85.5% { opacity: .95; }
  }
  @keyframes filament {   /* dips hard, nearly off for a split second, like a loose tube */
    0%, 30%, 36%, 82%, 86%, 100% { opacity: 1; }
    31% { opacity: .2; }   32.5% { opacity: .9; } 34% { opacity: .35; }
    83% { opacity: .12; }  85.5% { opacity: 1; }
  }
  .logo .glow     { animation: glow 6.1s infinite; }
  .logo .fil-glow { animation: filament 6.1s infinite; }
  .logo .fil      { animation: filament 6.1s infinite; }
  @media (prefers-reduced-motion: reduce) {
    .logo .glow, .logo .fil-glow, .logo .fil { animation: none; }
  }
</style>
